services:
  nyan-go:
    profiles: [dev]
    image: golang:1.27-alpine
    working_dir: /src
    command: go run ./cmd/nyan-go
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      SQLITE_PATH: /data/nyan-go.db
      WEB_ADDR: 0.0.0.0:8080
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - .:/src
      - nyan-go-dev-data:/data
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build

volumes:
  nyan-go-dev-data:
  go-mod-cache:
  go-build-cache:
