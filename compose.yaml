services:
  nyan-go:
    image: ghcr.io/marcomoi395/nyan-go:latest
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      SQLITE_PATH: /data/nyan-go.db
      WEB_ADDR: 0.0.0.0:8080
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - nyan-go-data:/data
    read_only: true
    tmpfs:
      - /tmp

volumes:
  nyan-go-data:
